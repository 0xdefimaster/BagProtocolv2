name: CI

# -----------------------------------------------------------------------------
# Closes the two gaps every previous local run of this project's own test
# suite had to report honestly rather than fake:
#   - `npm run test:integration` needs a real PostgreSQL superuser connection
#     (lib/server/__tests__/integration/pg-harness.ts) — never available in a
#     throwaway sandbox with no database. GitHub Actions' `services:` gives
#     each `integration` job run a real, disposable Postgres 16 container.
#   - `npm run build` needs real internet access to fetch Google Fonts
#     (next/font pulls from fonts.googleapis.com/fonts.gstatic.com at build
#     time) — GitHub-hosted runners have normal internet access, unlike a
#     network-restricted sandbox.
#
# Two jobs, run in parallel: the fast checks (secrets, lint, typecheck, unit
# tests, production build) and the integration tests against a REAL database.
# Contract tests live in contracts.yml and run only when contract code
# changes. The production build runs here too: `tsc` does not check what only
# `next build` checks (e.g. a route handler's signature: a `POST(req?: Request)`
# passed lint, typecheck and every test, and only the Netlify preview failed),
# and a failed preview is easy to miss while every CI row is green. Docs-only
# changes skip CI. Actions bills each job by the started
# minute, so fewer, fuller jobs cost less for the same coverage.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']

# A second push to the same branch/PR cancels whatever CI run is still in
# flight for it — no point finishing a check on code that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 24: the production dependency @lifi/composer-sdk@0.6 (and its
  # @lifi/compose-spec@0.6) declares `engines.node: ">=24"` — verified in
  # package-lock.json. package.json `engines` and .nvmrc pin the same major
  # so local dev, CI and the production runtime (Vercel reads `engines.node`)
  # all run the version the dependency tree actually supports.
  NODE_VERSION: '24'

jobs:
  # One job for the fast checks: one checkout and one `npm ci` instead of three
  # (Actions bills each job by the started minute).
  checks:
    name: Secrets, lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails on any tracked .env file other than .env.example, and on any
      # 32-byte hex private-key literal in the tree.
      - run: ./scripts/check-no-secrets.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Same job, same `npm ci`: catches what only Next's build checks (route
      # handler signatures, page exports, server/client boundaries).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  integration-tests:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    # A real, disposable PostgreSQL 16 — the exact "14+ superuser
    # connection" pg-harness.ts's own doc asks for. `postgres:16`'s default
    # image already includes everything schema.sql needs (gen_random_uuid()
    # has been built into Postgres core since v13 — no CREATE EXTENSION
    # required); the harness creates its own scratch database and the
    # anon/authenticated/service_role roles per test run, so nothing about
    # this service needs to look like an actual Supabase project.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # bag-deployment-local-evm.integration.test.ts spins up its own local
      # Hardhat node in-process via @nomicfoundation/hardhat-viem — it needs
      # BagFactory's compiled artifact to already exist, same as the
      # contracts job below.
      - run: npx hardhat compile
      - run: npm run test:integration
